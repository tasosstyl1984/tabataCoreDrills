<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108" fill="none">
  <!-- Tabata Core — hex interval frame + inward ticks + lightning core (new mark) -->
  <rect width="108" height="108" fill="#000000"/>
  <defs>
    <linearGradient id="coreBolt" x1="-8" y1="-22" x2="12" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#FF9A2E"/>
    </linearGradient>
  </defs>
  <g transform="translate(54 54)">
    <!-- Hexagon frame: alternating work (cyan) / rest (red) -->
    <path d="M 34,0 L 17,29.445" fill="none" stroke="#00E8FF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 17,29.445 L -17,29.445" fill="none" stroke="#FF3B45" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -17,29.445 L -34,0" fill="none" stroke="#00E8FF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -34,0 L -17,-29.445" fill="none" stroke="#FF3B45" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -17,-29.445 L 17,-29.445" fill="none" stroke="#00E8FF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 17,-29.445 L 34,0" fill="none" stroke="#FF3B45" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Inner facet line (depth) -->
    <path
      d="M 30.5,0 L 15.25,26.5 L -15.25,26.5 L -30.5,0 L -15.25,-26.5 L 15.25,-26.5 Z"
      fill="none"
      stroke="#141A1E"
      stroke-width="1.15"/>

    <!-- Interval ticks aimed at center (six micro beats) -->
    <path
      d="M 25.5,14.7225 L 22.47,12.97 M 0,29.445 L 0,25.445 M -25.5,14.7225 L -22.04,12.72 M -25.5,-14.7225 L -22.04,-12.72 M 0,-29.445 L 0,-25.445 M 25.5,-14.7225 L 22.04,-12.72"
      fill="none"
      stroke="#7AB8CC"
      stroke-width="1.35"
      stroke-linecap="round"
      opacity="0.75"/>

    <!-- Lightning core -->
    <path
      fill="url(#coreBolt)"
      d="M 3.5,-21 L -7.8,3.2 L 0.4,3.2 L -5.2,21.5 L 12.8,-4.5 L 3.8,-4.5 Z"/>
    <path
      fill="#FFFFFF"
      fill-opacity="0.28"
      d="M 3.5,-21 L -7.8,3.2 L 0.4,3.2 L -5.2,21.5 L 12.8,-4.5 L 3.8,-4.5 Z"
      transform="scale(0.88)"/>
  </g>
</svg>
